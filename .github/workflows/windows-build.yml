name: Windows build and installer

on:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to build (defaults to the calling workflow ref)
        required: false
        type: string
        default: ''
      artifact-name:
        description: Name of the downloadable installer artifact
        required: true
        type: string
    outputs:
      version:
        description: Package version used for the installer
        value: ${{ jobs.build.outputs.version }}

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 120
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Validate release version
        id: version
        env:
          RELEASE_BUILD: ${{ github.event_name == 'release' }}
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          if ($env:RELEASE_BUILD -eq 'true' -and $env:GITHUB_REF -ne "refs/tags/v$version") {
            Write-Error 'Release tag must match the package version in Cargo.toml'
            exit 1
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install build tools
        id: toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
          $bytes = [System.Text.Encoding]::UTF8.GetBytes((rustc -vV | Out-String))
          $key = [Convert]::ToHexString([System.Security.Cryptography.SHA256]::HashData($bytes)).ToLowerInvariant()
          "rust-key=$key" >> $env:GITHUB_OUTPUT
      - uses: actions/cache/restore@v6
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-windows-x64-${{ steps.toolchain.outputs.rust-key }}-${{ hashFiles('Cargo.lock', 'scripts/windows/build_installer.ps1') }}-${{ github.sha }}
          restore-keys: |
            rust-windows-x64-${{ steps.toolchain.outputs.rust-key }}-${{ hashFiles('Cargo.lock', 'scripts/windows/build_installer.ps1') }}-
      - name: Rust release tests and installer
        id: installer
        run: ./scripts/windows/build_installer.ps1 -Test
      # Preserve compiled dependencies even if a later step fails.
      - uses: actions/cache/save@v6
        if: ${{ !cancelled() && steps.installer.outcome == 'success' && steps.rust-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

