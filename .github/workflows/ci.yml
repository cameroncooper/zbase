name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    name: Workflow and script checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install linters
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Validate workflows and scripts
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/python-cache
        run: |
          "$(go env GOPATH)/bin/actionlint"
          git ls-files -z '*.sh' | xargs -0 shellcheck
          python3 -m compileall -q scripts
          python3 -m unittest discover -s scripts -p 'test_*.py' -v

  macos:
    name: macOS build, tests, and bundle verification
    runs-on: macos-15
    timeout-minutes: 120
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      DEPS_DIR: ${{ github.workspace }}/dist/macos-deps
      SPARKLE_DIR: ${{ github.workspace }}/dist/sparkle
      DYLD_FRAMEWORK_PATH: ${{ github.workspace }}/dist/sparkle
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install build tools
        id: toolchain
        run: |
          test "$(uname -m)" = arm64
          brew install cmake pkgconf meson ninja
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          echo "rust-key=$(rustc -vV | shasum -a 256 | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        id: media-cache
        with:
          path: |
            dist/macos-deps/prefix
            dist/macos-deps/downloads
          key: media-macos15-arm64-${{ hashFiles('scripts/macos/build_media_deps.sh') }}
      - name: Build pinned media libraries
        run: |
          scripts/macos/build_media_deps.sh
          echo "PKG_CONFIG_PATH=$DEPS_DIR/prefix/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_LIBDIR=$DEPS_DIR/prefix/lib/pkgconfig" >> "$GITHUB_ENV"
      # Save expensive native dependencies before subsequent checks can fail.
      - uses: actions/cache/save@v6
        if: steps.media-cache.outputs.cache-hit != 'true'
        with:
          path: |
            dist/macos-deps/prefix
            dist/macos-deps/downloads
          key: ${{ steps.media-cache.outputs.cache-primary-key }}
      - uses: actions/cache/restore@v6
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ci-rust-macos15-arm64-${{ steps.toolchain.outputs.rust-key }}-${{ hashFiles('Cargo.lock', 'scripts/macos/build_media_deps.sh') }}-${{ github.sha }}
          restore-keys: |
            ci-rust-macos15-arm64-${{ steps.toolchain.outputs.rust-key }}-${{ hashFiles('Cargo.lock', 'scripts/macos/build_media_deps.sh') }}-
      - name: Updater bridge checks
        run: |
          scripts/macos/prepare_sparkle.sh
          scripts/macos/test_updater_bridge.sh
      - name: Clippy
        id: clippy
        run: cargo clippy --locked --all-targets --features gpui/runtime_shaders,macos-updater --timings
      - name: Rust tests
        run: cargo test --locked --all-targets --features gpui/runtime_shaders,macos-updater --timings
      - name: Packaging integration tests
        run: python3 -m unittest discover -s scripts/macos -p 'test_*.py' -v
      - name: Build and verify self-contained app
        if: github.event_name != 'pull_request'
        run: |
          # Reuse the debug dependencies from Clippy/tests for the development app.
          # The Release workflow still builds and signs the optimized app.
          scripts/macos/build_app_bundle.sh debug
          python3 scripts/macos/bundle_dylibs.py dist/macos/zBase.app --prefix "$DEPS_DIR/prefix"
          plutil -lint dist/macos/zBase.app/Contents/Info.plist
          for library in dist/macos/zBase.app/Contents/Frameworks/*.dylib; do
            codesign --force --sign - "$library"
          done
          codesign --force --sign - dist/macos/zBase.app
          codesign --verify --deep --strict --verbose=2 dist/macos/zBase.app
      # Preserve compiled dependencies even if a later check or signing fails.
      - uses: actions/cache/save@v6
        if: ${{ !cancelled() && steps.clippy.outcome == 'success' && steps.rust-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - name: Archive development app
        if: github.event_name != 'pull_request'
        run: ditto -c -k --sequesterRsrc --keepParent dist/macos/zBase.app dist/macos/zBase-development.zip
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: macos-development-app
          path: dist/macos/zBase-development.zip
          if-no-files-found: error
          retention-days: 7
      - name: Upload Cargo timing reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: macos-cargo-timings
          path: target/cargo-timings/
          if-no-files-found: ignore
          retention-days: 7
