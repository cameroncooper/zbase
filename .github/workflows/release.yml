name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'New stable version without v; leave blank for a build-only test'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      ref: ${{ steps.prepare.outputs.ref }}
      release-id: ${{ steps.prepare.outputs.release-id }}
      stable: ${{ steps.prepare.outputs.stable }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Prepare release or build-only run
        id: prepare
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_ID: ${{ github.event.release.id }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [[ "$EVENT_NAME" == release ]]; then
            {
              echo "ref=$GITHUB_SHA"
              echo "release-id=$RELEASE_ID"
              echo "stable=$([[ "$PRERELEASE" == false ]] && echo true || echo false)"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$RELEASE_VERSION" ]]; then
            echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo 'Run releases from main; leave version blank for branch build tests.' >&2
            exit 1
          fi
          python3 scripts/prepare_release.py "$RELEASE_VERSION"
          tag="v$RELEASE_VERSION"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            echo "Tag $tag already exists. Retry failed jobs in the original run or choose a new version." >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock
          git commit -m "Release $tag"
          git tag -a "$tag" -m "zBase $tag"
          # Atomic push prevents a tag being published if main rejects the bump.
          git push --atomic origin HEAD:refs/heads/main "refs/tags/$tag"
          gh release create "$tag" --verify-tag --title "zBase $tag" --generate-notes
          release_id="$(gh api "repos/$GH_REPO/releases/tags/$tag" --jq .id)"
          {
            echo "ref=$(git rev-parse HEAD)"
            echo "release-id=$release_id"
            echo 'stable=true'
          } >> "$GITHUB_OUTPUT"
          printf 'Released [%s](https://github.com/%s/releases/tag/%s). Assets will appear as builds finish.\n' "$tag" "$GH_REPO" "$tag" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 120
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      DEPS_DIR: ${{ github.workspace }}/dist/macos-deps
      SPARKLE_DIR: ${{ github.workspace }}/dist/sparkle
      SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
      ZBASE_OFFICIAL_RELEASE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0
      - name: Validate release version and platform
        id: version
        env:
          RELEASE_BUILD: ${{ needs.prepare.outputs.release-id != '' }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.prepare.outputs.release-id }}
        run: |
          test "$(uname -m)" = arm64
          VERSION=$(awk -F'"' '/^version = / { print $2; exit }' Cargo.toml)
          if [[ "$RELEASE_BUILD" == true ]]; then
            if [[ "$(git rev-parse "refs/tags/v${VERSION}^{commit}")" != "$(git rev-parse HEAD)" ]]; then
              echo 'Release tag must match the package version in Cargo.toml' >&2
              exit 1
            fi
            if ! gh api "repos/$GH_REPO/releases/$RELEASE_ID" --jq '.immutable != true' | grep -qx true; then
              echo 'This workflow attaches assets after publication; immutable releases must be disabled' >&2
              exit 1
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Validate updater configuration
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          : "${SPARKLE_PUBLIC_KEY:?Set the SPARKLE_PUBLIC_KEY Actions variable}"
          : "${SPARKLE_PRIVATE_KEY:?Set the SPARKLE_PRIVATE_KEY Actions secret}"
      - name: Import and verify signing credentials
        env:
          MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: scripts/macos/import_signing_identity.sh
      - name: Install build tools
        id: toolchain
        run: |
          brew install cmake pkgconf meson ninja
          rustup toolchain install stable --profile minimal
          rustup default stable
          echo "rust-key=$(rustc -vV | shasum -a 256 | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        id: media-cache
        with:
          path: |
            dist/macos-deps/prefix
            dist/macos-deps/downloads
          key: media-macos15-arm64-${{ hashFiles('scripts/macos/build_media_deps.sh') }}
      - name: Build pinned media libraries
        run: |
          scripts/macos/build_media_deps.sh
          echo "PKG_CONFIG_PATH=$DEPS_DIR/prefix/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_LIBDIR=$DEPS_DIR/prefix/lib/pkgconfig" >> "$GITHUB_ENV"
      # Save expensive native dependencies before subsequent checks can fail.
      - uses: actions/cache/save@v6
        if: steps.media-cache.outputs.cache-hit != 'true'
        with:
          path: |
            dist/macos-deps/prefix
            dist/macos-deps/downloads
          key: ${{ steps.media-cache.outputs.cache-primary-key }}
      - uses: actions/cache/restore@v6
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-macos15-arm64-${{ steps.toolchain.outputs.rust-key }}-${{ hashFiles('Cargo.lock', 'scripts/macos/build_media_deps.sh') }}-${{ github.sha }}
          restore-keys: |
            rust-macos15-arm64-${{ steps.toolchain.outputs.rust-key }}-${{ hashFiles('Cargo.lock', 'scripts/macos/build_media_deps.sh') }}-
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Build the web view
        # The release binary embeds ui/dist, so the tests need it too.
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Prepare pinned updater framework
        run: scripts/macos/prepare_sparkle.sh
      - name: Packaging integration tests
        run: python3 -m unittest discover -s scripts/macos -p 'test_*.py' -v
      - name: Rust release tests
        env:
          DYLD_FRAMEWORK_PATH: ${{ github.workspace }}/dist/sparkle
        id: rust-tests
        run: cargo test --release --locked --all-targets --features custom-protocol,macos-updater --timings
      - name: Build and verify self-contained app
        run: |
          scripts/macos/build_app_bundle.sh release
          python3 scripts/macos/bundle_dylibs.py dist/macos/zBase.app --prefix "$DEPS_DIR/prefix"
      # Preserve compiled dependencies even if a later check or signing fails.
      - uses: actions/cache/save@v6
        if: ${{ !cancelled() && steps.rust-tests.outcome == 'success' && steps.rust-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - name: Sign, notarize, and validate app and DMG
        env:
          MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ vars.APPLE_API_ISSUER_ID }}
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/macos/package_release.sh dist/macos/zBase.app "dist/release/zBase-${VERSION}-macos-arm64.dmg"
      - name: Sign update archive
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: scripts/macos/sign_update.sh "dist/release/zBase-${{ steps.version.outputs.version }}-macos-arm64.dmg" "${{ steps.version.outputs.version }}"
      - name: Include corresponding media sources and build information
        run: |
          cp "$DEPS_DIR"/downloads/*.tar.* dist/release/
          cp -R dist/macos/zBase.app/Contents/Resources/Licenses/Media dist/release/media-build-info
      - uses: actions/upload-artifact@v7
        with:
          name: macos-release
          path: dist/release/
          if-no-files-found: error
      - name: Remove signing credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/zbase-signing/release.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/zbase-signing"

  build-windows:
    needs: prepare
    uses: ./.github/workflows/windows-build.yml
    with:
      artifact-name: windows-release
      ref: ${{ needs.prepare.outputs.ref }}

  attach:
    needs: [prepare, build]
    if: needs.prepare.outputs.release-id != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.build.outputs.version }}
      RELEASE_ID: ${{ needs.prepare.outputs.release-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - uses: actions/download-artifact@v8
        with:
          name: macos-release
          path: dist/release
      - name: Attach verified assets to the published release
        run: |
          TAG="v${VERSION}"
          # Check the original release still exists and accepts asset uploads.
          gh api "repos/$GH_REPO/releases/tags/$TAG" > release-state.json
          jq -e --argjson id "$RELEASE_ID" \
            '.id == $id and .draft == false and .immutable != true' release-state.json
          python3 scripts/publish_update_feed.py --release release-state.json --metadata dist/release/update.json --repository "$GH_REPO" --verify-existing-archive
          tar -czf dist/release/media-build-info.tar.gz -C dist/release media-build-info
          gh release upload "$TAG" dist/release/*.dmg dist/release/*.sha256 dist/release/*.tar.* --clobber

  # Separate from the macOS attach job, so a Windows failure never holds up the
  # DMG, the Homebrew formula or the update feed.
  attach-windows:
    needs: [prepare, build-windows]
    if: needs.prepare.outputs.release-id != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.build-windows.outputs.version }}
      RELEASE_ID: ${{ needs.prepare.outputs.release-id }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: windows-release
          path: dist/release
      - name: Attach the Windows installer to the published release
        run: |
          TAG="v${VERSION}"
          # Check the original release still exists and accepts asset uploads.
          gh api "repos/$GH_REPO/releases/tags/$TAG" > release-state.json
          jq -e --argjson id "$RELEASE_ID" \
            '.id == $id and .draft == false and .immutable != true' release-state.json
          gh release upload "$TAG" dist/release/*-windows-x64-setup.exe dist/release/*-windows-x64-setup.exe.sha256 --clobber

  update-homebrew:
    needs: [prepare, build, attach]
    if: needs.prepare.outputs.stable == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false
      - name: Update Homebrew source formula
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: python3 scripts/update_homebrew.py "v${VERSION}"

  publish-update-feed:
    needs: [prepare, build, attach]
    if: needs.prepare.outputs.stable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Read the branch after acquiring this lock; never overwrite a newer feed.
    concurrency:
      group: zbase-stable-update-feed
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_ID: ${{ needs.prepare.outputs.release-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: macos-release
          path: dist/release
      - name: Publish verified stable feed last
        run: |
          gh api "repos/$GH_REPO/releases/$RELEASE_ID" > "$RUNNER_TEMP/release.json"
          gh auth setup-git
          feed="$RUNNER_TEMP/zbase-update-feed"
          git init --initial-branch=updates "$feed"
          git -C "$feed" remote add origin "https://github.com/$GH_REPO.git"
          git -C "$feed" ls-remote --heads origin refs/heads/updates > "$RUNNER_TEMP/feed-ref"
          if [[ -s "$RUNNER_TEMP/feed-ref" ]]; then
            git -C "$feed" fetch --depth=1 origin updates
            git -C "$feed" checkout -B updates FETCH_HEAD
          fi
          python3 scripts/publish_update_feed.py --release "$RUNNER_TEMP/release.json" \
            --metadata dist/release/update.json --destination "$feed" --repository "$GH_REPO"
          git -C "$feed" config user.name 'github-actions[bot]'
          git -C "$feed" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$feed" add appcast.xml notes/
          if ! git -C "$feed" diff --cached --quiet; then
            git -C "$feed" commit -m 'Publish verified zBase update'
            git -C "$feed" push origin HEAD:updates
          fi
